name: practical1-q3

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: local-lab-encryption-key-change-in-production
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://lakekeeper:lakekeeper-local@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://lakekeeper:lakekeeper-local@postgres:5432/lakekeeper
  LAKEKEEPER__AUTHZ_BACKEND: allowall
  RUST_LOG: info

services:
  postgres:
    image: postgres:17.4-bookworm
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper-local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U lakekeeper -d lakekeeper']
      interval: 3s
      timeout: 5s
      retries: 30

  minio:
    # Archived Bitnami build of MinIO; the pinned public tag was checked.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin-local
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
      MINIO_SCHEME: http
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/bitnami/minio/data

  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    depends_on:
      minio:
        condition: service_started
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        i=0
        until mc --config-dir /tmp/mc alias set lab http://minio:9000 minioadmin minioadmin-local; do
          i=$$((i+1))
          [ "$$i" -lt 60 ] || exit 1
          sleep 2
        done
        mc --config-dir /tmp/mc mb --ignore-existing lab/warehouse
    restart: 'no'

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.9.0
    command: [migrate]
    environment: *lakekeeper-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.9.0
    command: [serve]
    environment: *lakekeeper-env
    ports:
      - '127.0.0.1:8181:8181'
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /home/nonroot/lakekeeper, healthcheck]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 10s

  trino:
    image: trinodb/trino:484
    mem_limit: 5g
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./config/trino:/etc/trino:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/v1/info]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  superset:
    profiles: [bi]
    build: ./config/superset
    mem_limit: 2g
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_SECRET_KEY: local-practical1-q3-secret-change-in-production
      SUPERSET_HOME: /app/superset_home
      PYTHONPATH: /app/pythonpath
    ports:
      - '127.0.0.1:8088:8088'
    volumes:
      - superset-data:/app/superset_home
      - ./config/superset:/app/pythonpath:ro
      - ./results:/evidence
    depends_on:
      trino:
        condition: service_healthy
    command: [/bin/bash, /app/pythonpath/start.sh]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8088/health]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 30s

volumes:
  postgres-data:
  minio-data:
  superset-data:
